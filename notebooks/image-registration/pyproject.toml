[project]
name = "image-registration"
version = "0.1.0"
description = "Runnable demos for the Image Registration blog series: a synthetic semiconductor-image benchmark with known ground-truth drift, classical registration (phase correlation, ECC, SIFT+RANSAC), and deep-learning registration (CNN affine regressor, LoFTR deep feature matching, a from-scratch VoxelMorph-style deformable network)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scikit-image>=0.24",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "torch>=2.4",
    "torchvision>=0.19",
    "kornia>=0.7",
]

[tool.uv]
package = false
