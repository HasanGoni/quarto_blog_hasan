[project]
name = "paper-eneas-tracking"
version = "0.1.0"
description = "Real, runnable reimplementation of ENEAS (Embedding-guided Neural Ensemble for Adaptive Segmentation, arXiv:2609.03756) -- real SAM2 video mask propagation plus a real semantic verification layer (DINOv2 embedding matching + Qwen2-VL conditional verification) that catches SAM2 latching onto a visually similar distractor, on real DAVIS-2017 video."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "accelerate>=0.34",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "qwen-vl-utils>=0.0.8",
]

[tool.uv]
package = false
