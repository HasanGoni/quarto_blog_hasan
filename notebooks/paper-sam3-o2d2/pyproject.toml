[project]
name = "paper-sam3-o2d2"
version = "0.1.0"
description = "Real reimplementation of SAM3-O2D2 (arXiv:2609.08281) — object-class-prompted SAM3 as a zero-shot OOD witness for an arbitrary frozen detector, wired into the real facebook/sam3 model plus a real torchvision detector, tested on real natural images and real semiconductor X-ray images."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.57",
    "accelerate>=0.34",
    "scikit-learn>=1.5",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "requests>=2.32",
]

[tool.uv]
package = false
