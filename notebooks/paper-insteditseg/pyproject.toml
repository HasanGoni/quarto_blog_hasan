[project]
name = "paper-insteditseg"
version = "0.1.0"
description = "Real, runnable reimplementation of InstEditSeg (Instruction-Driven Image Editing for Polyp and Skin Lesion Segmentation, arXiv:2609.02004) -- a diffusion U-Net (SD1.5-inpainting) with a zero-init DINO Feature Guidance Block, LoRA fine-tuned on real Kvasir-SEG polyp images to render an instruction-conditioned color overlay instead of a binary mask, with real dual-branch classifier-free guidance at inference."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "diffusers>=0.30",
    "accelerate>=0.34",
    "peft>=0.13",
    "datasets>=2.20",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
    "huggingface_hub>=0.25",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
package = false
