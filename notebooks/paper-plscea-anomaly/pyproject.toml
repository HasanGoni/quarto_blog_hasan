[project]
name = "paper-plscea-anomaly"
version = "0.1.0"
description = "Real, runnable reimplementation of PL-SCEA (Reconfiguring Pretrained Attention for Few-Shot Industrial Anomaly Detection, arXiv:2609.03655) -- a real, training-free reconfiguration of frozen DINOv2 attention (token-adaptive self-correlation over value features + power-law reweighting, zero new attention parameters) plus a lightweight VAE reconstruction head, evaluated few-shot on real MVTec-AD."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "accelerate>=0.34",
    "datasets>=2.20",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
    "scikit-learn>=1.5",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
]

[tool.uv]
package = false
