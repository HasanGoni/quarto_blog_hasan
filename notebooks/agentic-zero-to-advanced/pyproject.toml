[project]
name = "agentic-zero-to-advanced"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "pillow",
    "matplotlib",
    "aisuite",
    "pydantic",
    "openai",
    "langgraph>=1.2.12",
    "laya>=0.4.11",
    "lancedb>=0.40.0",
    "timm>=1.0.30",
    "deepagents>=0.7.32",
    "langchain-openai>=1.7.2",
    "ipykernel>=7.4.0",
    "nbclient>=0.10",   # run the literate notebooks in literate/ headless
    "nbformat>=5.10",
    "langgraph-checkpoint-sqlite>=3.1.2",
]

[tool.uv]
package = false
