[project]
name = "paper-sam2-change-detection"
version = "0.1.0"
description = "Real, runnable reimplementation of 'Progressive Pseudo-Label Optimization for Point-Supervised Change Detection' (arXiv:2609.02171) -- real SAM2 point-prompted segmentation on real LEVIR-CD bi-temporal image pairs converted into change pseudo-labels via a bi-temporal selection rule, refined by a lightweight CNN with an uncertainty-aware loss, then improved further via teacher-student self-training."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "accelerate>=0.34",
    "datasets>=2.20",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
package = false
