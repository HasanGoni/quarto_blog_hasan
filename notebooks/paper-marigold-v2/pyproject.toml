[project]
name = "paper-marigold-v2"
version = "0.1.0"
description = "Real Marigold V2 (arXiv:2609.08084) depth + normals inference, run on real GDXray+ Castings X-ray images -- for the local-ai / Paper of the Week blog series."
requires-python = ">=3.10"
dependencies = [
    "marigold-v2",
    "huggingface_hub>=0.25",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
]

[tool.uv.sources]
marigold-v2 = { path = "repo", editable = true }

[tool.uv]
package = false
