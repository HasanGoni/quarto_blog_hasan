[project]
name = "paper-dpa-anomaly"
version = "0.1.0"
description = "Real, runnable reimplementation of DPA (Decoupling Product-Agnostic Anomaly Representations for Zero-shot Anomaly Generation, arXiv:2609.02075) -- SD1.5-inpainting LoRA fine-tuned on real MVTec-AD defect/mask/caption triples, with a genuine held-out zero-shot test: (defect type, product category) combinations excluded entirely from training, then generated at inference and compared against the real (unseen) image."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "diffusers>=0.30",
    "accelerate>=0.34",
    "peft>=0.13",
    "datasets>=2.20",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[tool.uv]
package = false
