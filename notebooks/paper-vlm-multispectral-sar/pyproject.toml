[project]
name = "paper-vlm-multispectral-sar"
version = "0.1.0"
description = "Real, runnable reimplementation of 'Lightweight Adaptation of General-Purpose VLMs for Multispectral and SAR Image Understanding' (arXiv:2609.02187) -- Qwen2-VL-2B-Instruct LoRA-adapted to reason over named optical + SAR views via its native multi-image interface, trained on real EuroSAT (Sentinel-2) + EuroSAT-SAR (Sentinel-1) data."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "accelerate>=0.34",
    "peft>=0.13",
    "datasets>=2.20",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "numpy",
    "qwen-vl-utils>=0.0.8",
    "h5py>=3.16.0",
]

[tool.uv]
package = false
