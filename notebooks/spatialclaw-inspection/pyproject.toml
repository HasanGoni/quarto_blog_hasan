[project]
name = "spatialclaw-inspection"
version = "0.1.0"
description = "Smoke tests and image-only adaptation of NVlabs/SpatialClaw for inspection use cases"
requires-python = ">=3.11"
dependencies = [
    "jupyter_client>=8.6",
    "ipykernel>=6.29",
    "pyzmq>=26",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pillow>=10",
    "openai>=1.50",
    "pydantic>=2.7",
]

[tool.uv]
package = false
